<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 612" role="img" aria-labelledby="t d">
  <title id="t">How an AI model learns</title>
  <desc id="d">Four steps stacked from top to bottom: data, training, model, output. An arrow loops from output back to data: people check and correct it.</desc>
  <style>
    .node { fill: #ffffff; stroke: #ffafcc; stroke-width: 3; }
    .num { fill: #c2185b; }
    .num-text { fill: #ffffff; font: 800 20px "Nunito", system-ui, sans-serif; text-anchor: middle; }
    .title { fill: #9d174d; font: 700 27px "Playfair Display", Georgia, serif; }
    .sub { fill: #6b3a57; font: 600 19px "Nunito", system-ui, sans-serif; }
    .arrow { stroke: #ff8fb8; stroke-width: 4; fill: none; stroke-linecap: round; stroke-dasharray: 2 10; }
    .head { fill: #ff8fb8; }
    .dot { fill: #c2185b; }
    .loop-label { fill: #9d174d; font: 600 22px "Dancing Script", cursive; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .node { fill: #2c1626; stroke: #ff8fb8; }
      .title { fill: #ffd1e3; }
      .sub { fill: #f3c2d8; }
      .num { fill: #ff8fb8; }
      .num-text { fill: #1f0f1a; }
      .dot { fill: #ff8fb8; }
      .loop-label { fill: #ffd1e3; }
    }
    @media (prefers-reduced-motion: reduce) { .dot { display: none; } }
  </style>

  <!-- arrows down -->
  <path class="arrow" d="M145 136 V158"/><path class="head" d="M145 164 l-8 -12 h16 z"/>
  <path class="arrow" d="M145 286 V308"/><path class="head" d="M145 314 l-8 -12 h16 z"/>
  <path class="arrow" d="M145 436 V458"/><path class="head" d="M145 464 l-8 -12 h16 z"/>

  <!-- feedback loop: output back to data -->
  <path class="arrow" d="M274 526 H300 Q316 526 316 510 V92 Q316 76 300 76 H282"/>
  <path class="head" d="M276 76 l12 -8 v16 z"/>
  <text class="loop-label" transform="translate(348 301) rotate(-90)">people check &amp; correct it ♡</text>

  <!-- travelling dots (drawn under the boxes, so they only show on the arrows) -->
  <circle class="dot" r="6">
    <animateMotion dur="7s" repeatCount="indefinite" path="M145 76 V526 H316 V76 Z"/>
  </circle>
  <circle class="dot" r="6" opacity=".6">
    <animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M145 76 V526 H316 V76 Z"/>
  </circle>

  <!-- 1 data -->
  <rect class="node" x="20" y="20" width="250" height="114" rx="26"/>
  <circle class="num" cx="52" cy="54" r="17"/><text class="num-text" x="52" y="61">1</text>
  <text class="title" x="80" y="64">Data</text>
  <text class="sub" x="42" y="98">examples: text,</text>
  <text class="sub" x="42" y="121">images, sounds</text>

  <!-- 2 training -->
  <rect class="node" x="20" y="170" width="250" height="114" rx="26"/>
  <circle class="num" cx="52" cy="204" r="17"/><text class="num-text" x="52" y="211">2</text>
  <text class="title" x="80" y="214">Training</text>
  <text class="sub" x="42" y="248">it tweaks itself</text>
  <text class="sub" x="42" y="271">to spot patterns</text>

  <!-- 3 model -->
  <rect class="node" x="20" y="320" width="250" height="114" rx="26"/>
  <circle class="num" cx="52" cy="354" r="17"/><text class="num-text" x="52" y="361">3</text>
  <text class="title" x="80" y="364">Model</text>
  <text class="sub" x="42" y="398">the learned</text>
  <text class="sub" x="42" y="421">patterns, saved</text>

  <!-- 4 output -->
  <rect class="node" x="20" y="470" width="250" height="114" rx="26"/>
  <circle class="num" cx="52" cy="504" r="17"/><text class="num-text" x="52" y="511">4</text>
  <text class="title" x="80" y="514">Output</text>
  <text class="sub" x="42" y="548">a guess: a word,</text>
  <text class="sub" x="42" y="571">a label, an image</text>
</svg>
